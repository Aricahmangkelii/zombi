<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple 3D Zombie Shooter - Level System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body { overflow: hidden; background-color: #050807; color: white; }

        /* HUD Atas */
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);
        }
        .hud-item { font-size: 1.2rem; font-weight: bold; }
        .hud-item span { color: #2ecc71; }
        #level-text { color: #e74c3c; font-size: 1.5rem; }

        /* Notifikasi Tengah */
        #notification {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; font-weight: 900; color: #e74c3c;
            text-shadow: 0 0 20px rgba(231, 76, 60, 0.8); opacity: 0;
            transition: opacity 0.3s; pointer-events: none; text-align: center;
        }

        /* Control Panel Mode */
        #menu {
            position: absolute; top: 70px; left: 20px;
            background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 10px;
            display: flex; gap: 10px; align-items: center;
        }
        select, button {
            background: #111; color: white; border: 1px solid #2ecc71;
            padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        button:hover { background: #2ecc71; color: black; }

        /* Panduan Kontrol */
        #controls {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 20px;
            font-size: 0.85rem; color: #ccc; text-align: center;
        }
    </style>
    <!-- Library 3D Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui">
        <div class="hud-item">LEVEL: <span id="level-text">1</span></div>
        <div class="hud-item">P1 Skor: <span id="p1-score">0</span></div>
        <div class="hud-item" id="p2-box" style="display:none;">P2 Skor: <span id="p2-score">0</span></div>
        <div class="hud-item">Sisa Zombie: <span id="zombie-left">10</span></div>
    </div>

    <div id="menu">
        <select id="mode-select" onchange="changeMode(this.value)">
            <option value="1P">1 Player</option>
            <option value="2P">2 Players (Co-op)</option>
        </select>
        <button onclick="resetGame()">Restart Game</button>
    </div>

    <div id="notification">LEVEL 1</div>

    <div id="controls">
        P1: [A/D] Kiri/Kanan, [Spasi] Tembak | P2: [Panah Kiri/Kanan] Gerak, [Enter] Tembak
    </div>

    <script>
        // --- Sound Synthesizer (Tanpa file luar) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'shoot') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'hit') {
                osc.type = 'square'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'levelup') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // --- Variabel Permainan ---
        let mode = '1P';
        let currentLevel = 1;
        let zombiesToKill = 10;
        let p1Score = 0, p2Score = 0;
        let isGameActive = false;
        const keys = {};

        // --- Setup Three.js (Grafik 3D) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050807);
        scene.fog = new THREE.FogExp2(0x050807, 0.05);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lampu
        const light = new THREE.DirectionalLight(0x2ecc71, 1);
        light.position.set(0, 10, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x1a2621));

        // Lantai Area Permainan
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 30),
            new THREE.MeshStandardMaterial({ color: 0x111a14 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1;
        scene.add(ground);

        // --- Pembuatan Model 3D Sederhana ---
        function createPlayerMesh(color) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.5, 0.8), new THREE.MeshStandardMaterial({ color }));
            body.position.y = 0.75;
            group.add(body);
            return group;
        }

        function createZombieMesh() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.6, 0.9), new THREE.MeshStandardMaterial({ color: 0x276749 }));
            body.position.y = 0.8;
            group.add(body);
            return group;
        }

        let player1 = createPlayerMesh(0x3182ce);
        let player2 = createPlayerMesh(0xdd6b20);
        scene.add(player1);

        const bullets = [];
        const zombies = [];

        // --- Controls Input ---
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        let lastShotP1 = 0, lastShotP2 = 0;

        function handleInput() {
            if (!isGameActive) return;
            const now = Date.now();

            // P1 Controls
            if (keys['KeyA'] && player1.position.x > -10) player1.position.x -= 0.15;
            if (keys['KeyD'] && player1.position.x < 10) player1.position.x += 0.15;
            if (keys['Space'] && now - lastShotP1 > 200) {
                shoot(player1.position, 1, 0x63b3ed);
                lastShotP1 = now;
            }

            // P2 Controls
            if (mode === '2P') {
                if (keys['ArrowLeft'] && player2.position.x > -10) player2.position.x -= 0.15;
                if (keys['ArrowRight'] && player2.position.x < 10) player2.position.x += 0.15;
                if (keys['Enter'] && now - lastShotP2 > 200) {
                    shoot(player2.position, 2, 0xfbd38d);
                    lastShotP2 = now;
                }
            }
        }

        function shoot(pos, owner, color) {
            const bullet = new THREE.Mesh(
                new THREE.SphereGeometry(0.15),
                new THREE.MeshBasicMaterial({ color })
            );
            bullet.position.set(pos.x, 1, pos.z - 0.5);
            bullet.owner = owner;
            scene.add(bullet);
            bullets.push(bullet);
            playSound('shoot');
        }

        // --- Logika Spawning & Level ---
        function spawnZombie() {
            if (!isGameActive || zombiesToKill <= 0) return;

            const zombie = createZombieMesh();
            zombie.position.set((Math.random() - 0.5) * 20, -1, -12);
            // Kecepatan zombie bertambah seiring tingginya Level!
            zombie.speed = 0.03 + (currentLevel * 0.015);
            
            scene.add(zombie);
            zombies.push(zombie);

            // Interval penampakan zombie makin cepat di level tinggi
            const spawnRate = Math.max(400, 1500 - (currentLevel * 150));
            setTimeout(spawnZombie, spawnRate);
        }

        function checkLevelProgress() {
            if (zombiesToKill <= 0 && zombies.length === 0) {
                currentLevel++;
                playSound('levelup');
                startNextLevel();
            }
        }

        function startNextLevel() {
            zombiesToKill = 10 + (currentLevel * 5); // Target per level makin banyak
            document.getElementById('level-text').innerText = currentLevel;
            document.getElementById('zombie-left').innerText = zombiesToKill;
            
            showNotification("LEVEL " + currentLevel);
            setTimeout(spawnZombie, 1500);
        }

        function resetGame() {
            bullets.forEach(b => scene.remove(b));
            zombies.forEach(z => scene.remove(z));
            bullets.length = 0; zombies.length = 0;

            currentLevel = 1;
            p1Score = 0; p2Score = 0;
            document.getElementById('p1-score').innerText = 0;
            document.getElementById('p2-score').innerText = 0;

            player1.position.set(mode === '2P' ? -2 : 0, -1, 8);
            player2.position.set(2, -1, 8);

            if (mode === '2P') {
                scene.add(player2);
                document.getElementById('p2-box').style.display = 'block';
            } else {
                scene.remove(player2);
                document.getElementById('p2-box').style.display = 'none';
            }

            isGameActive = true;
            startNextLevel();
        }

        function gameOver() {
            isGameActive = false;
            showNotification("GAME OVER!");
        }

        function showNotification(text) {
            const el = document.getElementById('notification');
            el.innerText = text;
            el.style.opacity = 1;
            setTimeout(() => el.style.opacity = 0, 1500);
        }

        function changeMode(val) {
            mode = val;
            resetGame();
        }

        // --- Loop Animasi ---
        function animate() {
            requestAnimationFrame(animate);

            if (isGameActive) {
                handleInput();

                // Pergerakan Peluru
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.position.z -= 0.4;
                    if (b.position.z < -15) {
                        scene.remove(b); bullets.splice(i, 1);
                    }
                }

                // Pergerakan Zombie & Tabrakan
                for (let i = zombies.length - 1; i >= 0; i--) {
                    const z = zombies[i];
                    z.position.z += z.speed;

                    // Cek Hit Peluru
                    for (let j = bullets.length - 1; j >= 0; j--) {
                        const b = bullets[j];
                        if (z.position.distanceTo(b.position) < 1.0) {
                            playSound('hit');
                            if (b.owner === 1) { p1Score += 50; document.getElementById('p1-score').innerText = p1Score; }
                            else { p2Score += 50; document.getElementById('p2-score').innerText = p2Score; }

                            zombiesToKill = Math.max(0, zombiesToKill - 1);
                            document.getElementById('zombie-left').innerText = zombiesToKill;

                            scene.remove(z); scene.remove(b);
                            zombies.splice(i, 1); bullets.splice(j, 1);
                            
                            checkLevelProgress();
                            break;
                        }
                    }

                    // Zombie Menerobos (Kalah)
                    if (z && z.position.z > 8) {
                        gameOver();
                        break;
                    }
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start Pertama Kali
        resetGame();
        animate();
    </script>
</body>
</html>
