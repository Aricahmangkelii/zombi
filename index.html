<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Zombie Shooter - Night Apocalypse</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050807;
            color: #ffffff;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .card {
            background: rgba(15, 23, 18, 0.85);
            border: 1px solid rgba(46, 204, 113, 0.3);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.2);
            pointer-events: auto;
        }

        .score-board {
            display: flex;
            gap: 20px;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .score-item span {
            color: #2ecc71;
        }

        #timer-box {
            font-size: 2rem;
            font-weight: 800;
            color: #e74c3c;
            min-width: 70px;
            text-align: center;
        }

        #notification {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.8rem;
            font-weight: 900;
            text-shadow: 0 0 25px rgba(231, 76, 60, 0.9);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
            color: #e74c3c;
        }

        #settings-bar {
            position: absolute;
            top: 85px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.9rem;
        }

        select, button {
            background: #111a14;
            border: 1px solid #2e7d32;
            color: white;
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #2ecc71;
            color: #000;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
        }

        #controls-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            color: #a0aec0;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>

    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="card score-board">
                <div class="score-item">P1 Skor: <span id="p1-score">0</span></div>
                <div class="score-item" id="p2-score-box" style="display:none;">P2 Skor: <span id="p2-score">0</span></div>
                <div class="score-item">Zombie Emas: <span id="kills">0</span></div>
            </div>

            <div class="card" id="timer-box">60</div>
        </div>

        <div id="settings-bar" class="card">
            <div>
                <label for="mode-select">Mode: </label>
                <select id="mode-select" onchange="changeMode(this.value)">
                    <option value="solo">1 Player vs Horde</option>
                    <option value="duo">2 Players (Co-op)</option>
                </select>
            </div>
            <div>
                <label for="level-select">Level Zombie: </label>
                <select id="level-select" onchange="changeLevel(this.value)">
                    <option value="easy">Easy (Lambat)</option>
                    <option value="medium" selected>Medium (Normal)</option>
                    <option value="hard">Hard (Ganas & Cepat)</option>
                </select>
            </div>
            <button onclick="resetGame()" style="margin-top: 5px;">Mulai Ulang Game</button>
        </div>

        <div id="notification">SURVIVE!</div>

        <div id="controls-info">
            P1: [A/D] Kiri/Kanan, [W/S] Maju/Mundur, [Spasi] Tembak | P2: [Panah] Gerak, [Enter/Numpad0] Tembak
        </div>
    </div>

    <script>
        // --- Web Audio API (Efek Suara Synthesizer) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'gunshot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.start(); osc.stop(audioCtx.currentTime + 0.12);
            } else if (type === 'zombie_die') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.8);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc.start(); osc.stop(audioCtx.currentTime + 0.8);
            }
        }

        // --- Logika Game ---
        let gameMode = 'solo';
        let aiLevel = 'medium';
        let p1Score = 0;
        let p2Score = 0;
        let killsCount = 0;
        let timer = 60;
        let timerInterval = null;
        let isGameActive = false;

        const keys = {};

        // --- Three.js Setup (Dunia 3D & Latar Malam) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050807);
        scene.fog = new THREE.FogExp2(0x050807, 0.04);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 16);
        camera.rotation.x = -0.1;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Pencahayaan Malam (Dim + Red Danger Light)
        const ambientLight = new THREE.AmbientLight(0x1a2621, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x2ecc71, 0.5);
        dirLight.position.set(5, 12, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Panggung / Lahan Kuburan 3D
        const groundGeo = new THREE.PlaneGeometry(60, 60);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x111a14, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1;
        ground.receiveShadow = true;
        scene.add(ground);

        // Dekorasi Latar: Batu Nisan 3D
        for (let i = 0; i < 20; i++) {
            const tombGeo = new THREE.BoxGeometry(1, 1.8, 0.3);
            const tombMat = new THREE.MeshStandardMaterial({ color: 0x2d3748, roughness: 0.8 });
            const tomb = new THREE.Mesh(tombGeo, tombMat);
            tomb.position.set((Math.random() - 0.5) * 40, -0.1, (Math.random() - 0.5) * 30 - 5);
            scene.add(tomb);
        }

        // Partikel Kabut/Spora
        const particleCount = 300;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePos[i] = (Math.random() - 0.5) * 50;
            particlePos[i + 1] = Math.random() * 8;
            particlePos[i + 2] = (Math.random() - 0.5) * 50;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x2ecc71, size: 0.1, transparent: true, opacity: 0.4 });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // --- Pembuatan Karakter Survivor & Zombie 3D ---
        function createSurvivor(colorHex) {
            const group = new THREE.Group();
            
            // Badan
            const bodyGeo = new THREE.BoxGeometry(1, 1.8, 0.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.5 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.9;
            group.add(body);

            // Kepala
            const headGeo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.15;
            group.add(head);

            // Senjata
            const gunGeo = new THREE.BoxGeometry(0.2, 0.2, 1.2);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x1a202c, metalness: 0.8 });
            const gun = new THREE.Mesh(gunGeo, gunMat);
            gun.position.set(0.4, 1.2, -0.6);
            group.add(gun);

            return group;
        }

        function createZombie() {
            const group = new THREE.Group();
            
            // Badan Zombie (Hijau Lusuh)
            const bodyGeo = new THREE.BoxGeometry(1.1, 1.9, 0.9);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x276749, roughness: 0.9 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.95;
            group.add(body);

            // Mata Merah Menyala
            const eyeGeo = new THREE.BoxGeometry(0.2, 0.1, 0.1);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xe53e3e });
            const eye1 = new THREE.Mesh(eyeGeo, eyeMat);
            const eye2 = eye1.clone();
            eye1.position.set(-0.2, 2.1, -0.46);
            eye2.position.set(0.2, 2.1, -0.46);
            group.add(eye1, eye2);

            return group;
        }

        // Entitas Pemain
        let survivor1 = createSurvivor(0x3182ce); // P1 Biru
        let survivor2 = createSurvivor(0xdd6b20); // P2 Oranye
        survivor1.position.set(-3, -1, 10);
        survivor2.position.set(3, -1, 10);

        scene.add(survivor1);

        const bullets = [];
        const zombies = [];

        // --- Kontrol dan Input ---
        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        let lastShootP1 = 0;
        let lastShootP2 = 0;

        function handleInput() {
            if (!isGameActive) return;

            const speed = 0.18;
            const now = Date.now();

            // P1 Input (WASD + Space)
            if (keys['KeyA'] && survivor1.position.x > -14) survivor1.position.x -= speed;
            if (keys['KeyD'] && survivor1.position.x < 14) survivor1.position.x += speed;
            if (keys['KeyW'] && survivor1.position.z > -2) survivor1.position.z -= speed;
            if (keys['KeyS'] && survivor1.position.z < 12) survivor1.position.z += speed;
            if (keys['Space'] && now - lastShootP1 > 160) {
                shootBullet(survivor1.position, 1, 0x63b3ed);
                lastShootP1 = now;
            }

            // P2 Input (Panah + Enter)
            if (gameMode === 'duo') {
                if (keys['ArrowLeft'] && survivor2.position.x > -14) survivor2.position.x -= speed;
                if (keys['ArrowRight'] && survivor2.position.x < 14) survivor2.position.x += speed;
                if (keys['ArrowUp'] && survivor2.position.z > -2) survivor2.position.z -= speed;
                if (keys['ArrowDown'] && survivor2.position.z < 12) survivor2.position.z += speed;
                if ((keys['Enter'] || keys['Numpad0']) && now - lastShootP2 > 160) {
                    shootBullet(survivor2.position, 2, 0xfbd38d);
                    lastShootP2 = now;
                }
            }
        }

        function shootBullet(pos, owner, colorHex) {
            const geo = new THREE.SphereGeometry(0.15, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: colorHex });
            const bullet = new THREE.Mesh(geo, mat);
            bullet.position.set(pos.x, pos.y + 1.2, pos.z - 0.8);
            bullet.owner = owner;

            scene.add(bullet);
            bullets.push(bullet);
            playSound('gunshot');
        }

        // --- Logika Zombie AI ---
        function spawnZombie() {
            if (!isGameActive) return;

            const zombie = createZombie();
            zombie.position.set((Math.random() - 0.5) * 26, -1, -15);
            
            let speedModifier = 1;
            if (aiLevel === 'easy') speedModifier = 0.5;
            if (aiLevel === 'hard') speedModifier = 1.5;

            zombie.speed = (0.04 + Math.random() * 0.04) * speedModifier;
            scene.add(zombie);
            zombies.push(zombie);

            let spawnDelay = aiLevel === 'hard' ? 600 : (aiLevel === 'easy' ? 1600 : 1000);
            setTimeout(spawnZombie, spawnDelay);
        }

        // --- Alur & Timer ---
        function startTimer() {
            clearInterval(timerInterval);
            timer = 60;
            document.getElementById('timer-box').innerText = timer;

            timerInterval = setInterval(() => {
                if (!isGameActive) return;
                timer--;
                document.getElementById('timer-box').innerText = timer;
                if (timer <= 0) {
                    endGame("SURVIVED THE NIGHT!");
                }
            }, 1000);
        }

        function endGame(msg) {
            isGameActive = false;
            clearInterval(timerInterval);
            showNotification(msg);
            playSound('gameover');
        }

        function resetGame() {
            bullets.forEach(b => scene.remove(b));
            zombies.forEach(z => scene.remove(z));
            bullets.length = 0;
            zombies.length = 0;

            p1Score = 0; p2Score = 0; killsCount = 0;
            document.getElementById('p1-score').innerText = 0;
            document.getElementById('p2-score').innerText = 0;
            document.getElementById('kills').innerText = 0;

            survivor1.position.set(gameMode === 'duo' ? -3 : 0, -1, 10);
            survivor2.position.set(3, -1, 10);

            if (gameMode === 'duo') {
                scene.add(survivor2);
                document.getElementById('p2-score-box').style.display = 'block';
            } else {
                scene.remove(survivor2);
                document.getElementById('p2-score-box').style.display = 'none';
            }

            isGameActive = true;
            showNotification("SURVIVE!");
            startTimer();
            spawnZombie();
        }

        function showNotification(msg) {
            const notif = document.getElementById('notification');
            notif.innerText = msg;
            notif.style.opacity = 1;
            notif.style.transform = 'translate(-50%, -50%) scale(1.1)';
            setTimeout(() => {
                notif.style.opacity = 0;
                notif.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 2000);
        }

        function changeMode(val) {
            gameMode = val;
            resetGame();
        }

        function changeLevel(val) {
            aiLevel = val;
            resetGame();
        }

        // --- Render Loop (Animasi Frame & Tabrakan) ---
        function animate() {
            requestAnimationFrame(animate);

            // Pergerakan Spora Kabut Latar
            particles.rotation.y += 0.001;

            if (isGameActive) {
                handleInput();

                // Update Peluru
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.position.z -= 0.5;

                    if (b.position.z < -20) {
                        scene.remove(b);
                        bullets.splice(i, 1);
                    }
                }

                // Update Zombie AI & Cek Tabrakan
                for (let i = zombies.length - 1; i >= 0; i--) {
                    const z = zombies[i];
                    z.position.z += z.speed;
                    
                    // Efek Berjalan Zombie
                    z.rotation.z = Math.sin(Date.now() * 0.008) * 0.08;

                    // Tabrakan Peluru x Zombie
                    for (let j = bullets.length - 1; j >= 0; j--) {
                        const b = bullets[j];
                        if (z.position.distanceTo(b.position) < 1.2) {
                            playSound('zombie_die');
                            
                            if (b.owner === 1) { p1Score += 100; document.getElementById('p1-score').innerText = p1Score; }
                            else { p2Score += 100; document.getElementById('p2-score').innerText = p2Score; }

                            killsCount++;
                            document.getElementById('kills').innerText = killsCount;

                            scene.remove(z);
                            scene.remove(b);
                            zombies.splice(i, 1);
                            bullets.splice(j, 1);
                            break;
                        }
                    }

                    // Zombie Menembus Pertahanan (Game Over)
                    if (z && z.position.z > 12) {
                        scene.remove(z);
                        zombies.splice(i, 1);
                        endGame("ZOMBIES OVERRUN!");
                        break;
                    }
                }
            }

            renderer.render(scene, camera);
        }

        // Responsif Ukuran Layar
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Jalankan Game
        resetGame();
        animate();
    </script>
</body>
</html>
